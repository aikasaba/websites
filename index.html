<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <title>Ikasaba Web</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: #f4f5f7; color: #20242c; }
    main { width: min(100%, 42rem); padding: clamp(2rem, 7vw, 4rem); border: 1px solid #dfe3e8; border-radius: 1.5rem; background: #fff; box-shadow: 0 1rem 3rem #20242c12; }
    .eyebrow { color: #596579; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .75rem 0 1rem; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; }
    p { color: #596579; line-height: 1.8; }
    @media (prefers-color-scheme: dark) {
      body { background: #15181e; color: #f3f5f8; }
      main { border-color: #343a46; background: #20242c; box-shadow: 0 1rem 3rem #0004; }
      .eyebrow, p { color: #adb7c7; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Ikasaba</div>
    <h1>Web共有ページ</h1>
    <p>ここは身内向けのWebページを公開するための場所です。ページの内容は、このリポジトリにファイルを追加して更新できます。</p>
  </main>
</body>
</html>
